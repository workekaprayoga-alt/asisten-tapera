[theme]
base = "dark"
primaryColor = "#38bdf8"
backgroundColor = "#0f1117"
secondaryBackgroundColor = "#1a1a2e"
textColor = "#ececec"
font = "sans serif"

[server]
# Matikan file watcher — lebih stabil di Streamlit Cloud
fileWatcherType = "none"
# Maksimalkan upload size kalau nanti mau upload data
maxUploadSize = 200

[runner]
# Jangan rerun kalau ada magic command
magicEnabled = false

[browser]
# Nonaktifkan usage stats
gatherUsageStats = false
